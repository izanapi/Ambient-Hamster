<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#173d22">
<title>AMBIENT GENERATOR MM-001</title>
<style>
:root{
  --bg:#173f24;
  --ink:#f2eedc;
  --dim:#a9b79c;
  --line:rgba(242,238,220,.30);
  --faint:rgba(242,238,220,.10);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#102d19;color:var(--ink);font-family:"Courier New",monospace}
body{-webkit-text-size-adjust:100%;overflow:hidden}
#app{
  width:100%;max-width:520px;height:100svh;margin:auto;
  padding:calc(12px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom));
  background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;
}
#app:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px);
}
header{
  position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:1px solid var(--line);padding-bottom:8px;flex:0 0 auto;
}
h1{font-weight:400;font-size:15px;letter-spacing:.15em;margin:0}
.micro{font-size:8px;color:var(--dim);letter-spacing:.09em;line-height:1.45}
.status{text-align:right;font-size:9px;color:var(--dim);line-height:1.5}
.topStart{
  appearance:none;-webkit-appearance:none;background:transparent;color:var(--ink);
  border:0;border-bottom:1px solid var(--line);padding:0 0 3px;margin:0 0 2px;
  font:9px "Courier New",monospace;letter-spacing:.13em;min-height:22px;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.topStart:active{opacity:.55}

.main{
  position:relative;z-index:2;display:grid;grid-template-columns:42% 58%;gap:10px;
  min-height:0;flex:1;padding-top:10px;
}
.left{
  display:flex;flex-direction:column;justify-content:space-evenly;
  border-right:1px solid var(--line);padding-right:12px;min-height:0;
}
.param{min-height:0}
.param input[type=range], .spaceRow input[type=range], .fx input[type=range], .entSlider{
  padding:10px 0;
  margin:-10px 0;
  box-sizing:content-box;
}
.ph{display:flex;justify-content:space-between;align-items:end;margin-bottom:3px}
.pname{font-size:14px;letter-spacing:.14em}
.pval{font-size:15px;font-variant-numeric:tabular-nums}
.desc{font-size:7px;color:var(--dim);letter-spacing:.05em;margin-bottom:4px}
.hist{height:31px;overflow:hidden;white-space:normal;font-size:6.2px;line-height:1.35;color:var(--dim);margin-top:5px;word-spacing:4px}

/* thin instrument slider */
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0;
  touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer;
  position:relative;
}
input[type=range]::-webkit-slider-runnable-track{
  height:1px;background:var(--ink);
  background-image:repeating-linear-gradient(90deg,transparent 0 9px,var(--line) 9px 10px);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:8px;height:13px;border-radius:0;
  background:var(--ink);border:1px solid var(--bg);margin-top:-6px;
}
input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:7px;height:12px;border-radius:0;border:none;background:var(--ink)}

.right{
  min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 2px;
}
.entLabel{font-size:9px;letter-spacing:.38em;color:var(--ink);margin-bottom:1px}
.entVal{font-size:25px;letter-spacing:.07em;font-variant-numeric:tabular-nums;margin-bottom:0}
#core{display:block;width:100%;height:min(33vh,260px);min-height:170px}
.entSlider{width:86%!important;margin-top:-3px!important}
.order{width:86%;display:flex;justify-content:space-between;font-size:6.5px;color:var(--dim);letter-spacing:.12em}
.entHist{width:86%;text-align:center;height:9px;margin-top:2px}

.bottom{
  position:relative;z-index:2;flex:0 0 auto;border-top:1px solid var(--line);padding-top:7px;
}
.spaceRow{display:grid;grid-template-columns:54px 1fr 28px;gap:8px;align-items:center;margin-bottom:7px}
.spaceRow label{font-size:9px;letter-spacing:.18em}
.spaceRow .num{text-align:right;font-size:9px}

.fx{
  display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.fxcell{padding:6px 8px 5px;min-width:0}
.fxcell+.fxcell{border-left:1px solid var(--line)}
.fxhead{display:flex;justify-content:space-between;font-size:8px;letter-spacing:.09em;margin-bottom:3px}
.fx input[type=range]{height:14px}
.fx input[type=range]::-webkit-slider-thumb{width:7px;height:11px;margin-top:-5px}

footer{
  display:flex;justify-content:space-between;margin-top:3px;font-size:6.5px;color:var(--dim);letter-spacing:.08em
}

/* short iPhones */
@media(max-height:740px){

  #app{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:calc(7px + env(safe-area-inset-bottom))}
  #core{height:27vh;min-height:145px}
  .hist{display:none}
  .desc{margin-bottom:4px}
  .controls{margin-top:4px}
  button{min-height:27px}
}
</style>
</head>
<body>
<main id="app">
<header>
  <div>
    <h1>AMBIENT GENERATOR</h1>
    <div class="micro">MM-001 / PROCEDURAL FIELD</div>
  </div>
  <div class="status"><button id="start" class="topStart">▶ START</button><br><span id="clock">00:00:00</span></div>
</header>

<section class="main">
  <div class="left" id="params"></div>

  <div class="right">
    <div class="entLabel">ENTROPY</div>
    <div class="entVal" id="entropyNow">43.0000</div>
    <canvas id="core" width="300" height="280"></canvas>
    <input class="entSlider" id="entropy" type="range" min="0" max="100" value="43">
    <div class="order"><span>ORDER</span><span>CHAOS</span></div>
    <div class="hist entHist" id="entropyHist"></div>
  </div>
</section>

<section class="bottom">
  <div class="spaceRow">
    <label>SPACE</label>
    <input id="space" type="range" min="0" max="100" value="72">
    <span class="num" id="spaceV">72</span>
  </div>

  <div class="fx">
    <div class="fxcell">
      <div class="fxhead"><span>ECHO</span><span id="echoV">0</span></div>
      <input id="echo" type="range" min="0" max="100" value="0">
    </div>
    <div class="fxcell">
      <div class="fxhead"><span>HALL</span><span id="hallV">10</span></div>
      <input id="hall" type="range" min="0" max="100" value="10">
    </div>
    <div class="fxcell">
      <div class="fxhead"><span>VOLUME</span><span id="volumeV">78</span></div>
      <input id="volume" type="range" min="0" max="100" value="78">
    </div>
  </div>

  <footer><span>ver. 1.5.2</span><span>MM-001</span></footer>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const defs=[['AIR','atmospheric bed',50],['DRONE','harmonic field',35],['GHOST','rare events',18],['PYRO','spark events',16]];
const metricDefs={
  AIR:[['FLUX',''],['BAND','Hz'],['DRIFT','']],
  DRONE:[['ROOT','Hz'],['DETUNE','ct'],['DENS','']],
  GHOST:[['RATE','/m'],['DECAY','s'],['DEPTH','']],
  PYRO:[['RATE','/s'],['BRIGHT','Hz'],['BURST','']]
};

const holder=$('params');

defs.forEach(([n,s,v])=>{
  holder.insertAdjacentHTML('beforeend',`
  <section class="param">
    <div class="ph"><span class="pname">${n}</span><span class="pval" id="${n}Now">${v.toFixed(4)}</span></div>
    <div class="desc">${s}</div>
    <input id="${n}" type="range" min="0" max="100" value="${v}">
    <div class="metrics" id="${n}Metrics"></div>

  </section>`);
});
defs.forEach(([n])=>{
  const m=$(n+'Metrics');
  if(m){
    m.innerHTML=metricDefs[n].map((d,i)=>`<div class="metric"><div class="mk">${d[0]}</div><div class="mv" id="${n}M${i}">--</div></div>`).join('');
  }
});

let ctx=null, master=null, comp=null;
let dryBus=null, spaceFilter=null;
let echoDelay=null, echoFeedback=null, echoWet=null;
let hall=null, hallWet=null;
let airGain=null, droneGain=null;
let started=false,startTime=0,timer=null,ghostTimer=null,crackleTimer=null;
let seed=Math.floor(Math.random()*0xffffffff),phase=0,nodes=[];
let vals={AIR:50,DRONE:35,GHOST:18,PYRO:16,entropy:43};

function rng(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}
function noiseBuffer(sec=2){
  const b=ctx.createBuffer(1,Math.floor(ctx.sampleRate*sec),ctx.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=rng()*2-1;
  return b;
}
function makeHallIR(seconds=10.5,decay=2.0){
  const len=Math.floor(ctx.sampleRate*seconds),b=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=b.getChannelData(ch);
    for(let i=0;i<len;i++){
      const t=i/len;
      const early=i<ctx.sampleRate*.16 ? (1-i/(ctx.sampleRate*.16))*.30 : 0;
      const tail=Math.pow(1-t,decay);
      d[i]=(rng()*2-1)*(tail+early*.22);
    }
  }
  return b;
}
function routeSource(node){
  node.connect(dryBus);
  node.connect(echoDelay);
  node.connect(hall);
}
function initAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)throw new Error('WEB AUDIO UNAVAILABLE');
  ctx=new AC();

  master=ctx.createGain();
  master.gain.value=.45;
  comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-12;comp.ratio.value=5;comp.attack.value=.01;comp.release.value=.25;
  comp.connect(master);master.connect(ctx.destination);

  dryBus=ctx.createGain();
  spaceFilter=ctx.createBiquadFilter();
  spaceFilter.type='lowpass';spaceFilter.frequency.value=4200;spaceFilter.Q.value=.25;
  dryBus.connect(spaceFilter);spaceFilter.connect(comp);

  echoDelay=ctx.createDelay(2.5);
  echoFeedback=ctx.createGain();
  echoWet=ctx.createGain();
  echoDelay.connect(echoFeedback);
  echoFeedback.connect(echoDelay);
  echoDelay.connect(echoWet);
  echoWet.connect(comp);

  hall=ctx.createConvolver();
  hall.buffer=makeHallIR();
  hallWet=ctx.createGain();
  hall.connect(hallWet);
  hallWet.connect(comp);

  const src=ctx.createBufferSource();
  src.buffer=noiseBuffer();src.loop=true;
  const bp=ctx.createBiquadFilter();
  bp.type='bandpass';bp.frequency.value=900;bp.Q.value=.45;
  airGain=ctx.createGain();airGain.gain.value=.07;
  src.connect(bp).connect(airGain);
  routeSource(airGain);
  src.start();
  nodes.push(src,bp);

  droneGain=ctx.createGain();droneGain.gain.value=.045;
  routeSource(droneGain);
  [73.42,110,146.83].forEach((f,i)=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=i===0?'triangle':'sine';
    o.frequency.value=f*(1+(rng()-.5)*.004);
    g.gain.value=[.5,.22,.12][i];
    o.connect(g).connect(droneGain);
    o.start();nodes.push(o);
  });
  updateFX();
}
async function ensureAudio(){
  try{
    if(!ctx||ctx.state==='closed')initAudio();
    if(ctx.state!=='running')await ctx.resume();
    return ctx.state==='running';
  }catch(e){
    console.error(e);
    return false;
  }
}
function updateFX(){
  if(!ctx)return;
  const s=+$('space').value/100;
  const e=+$('echo').value/100;
  const h=+$('hall').value/100;
  const v=+$('volume').value/100;
  spaceFilter.frequency.setTargetAtTime(7800-s*6100,ctx.currentTime,.45);
  dryBus.gain.setTargetAtTime(1-s*.26,ctx.currentTime,.35);
  const ec=Math.pow(e,1.18);
  echoDelay.delayTime.setTargetAtTime(.09+ec*1.42,ctx.currentTime,.18);
  echoFeedback.gain.setTargetAtTime(Math.min(.945,ec*.975),ctx.currentTime,.18);
  echoWet.gain.setTargetAtTime(ec*1.05,ctx.currentTime,.16);
  const hc=Math.pow(h,.74);
  hallWet.gain.setTargetAtTime(hc*1.42,ctx.currentTime,.20);
  master.gain.setTargetAtTime(v*.60,ctx.currentTime,.10);
}

function fireCrackle(){
  clearTimeout(crackleTimer);
  if(!started||!ctx)return;

  const amt=+$('PYRO').value/100;
  const ent=+$('entropy').value/100;

  // At low values: sparse ticks. At high values: clusters and little bursts.
  const baseWait=180+Math.pow(1-amt,1.7)*1600;
  const wait=baseWait*(.55+rng()*.95)*(1-ent*.18);

  crackleTimer=setTimeout(()=>{
    if(started&&ctx&&ctx.state==='running'&&rng() < .28+amt*.72){
      const now=ctx.currentTime;
      const cluster=1 + (rng()<amt*.42 ? 1+Math.floor(rng()*3) : 0);

      for(let k=0;k<cluster;k++){
        const dur=.012+rng()*.075;
        const b=ctx.createBuffer(1,Math.max(8,Math.floor(ctx.sampleRate*dur)),ctx.sampleRate);
        const d=b.getChannelData(0);

        // Very short decaying noise burst, biased toward sharp initial transients.
        for(let i=0;i<d.length;i++){
          const p=i/d.length;
          const env=Math.pow(1-p,2.6);
          const grit=(rng()*2-1);
          d[i]=grit*env;
        }

        const s=ctx.createBufferSource();
        s.buffer=b;

        const hp=ctx.createBiquadFilter();
        hp.type='highpass';
        hp.frequency.value=1800+rng()*2200;
        hp.Q.value=.25+rng()*.8;

        const bp=ctx.createBiquadFilter();
        bp.type='bandpass';
        bp.frequency.value=2800+rng()*5200;
        bp.Q.value=.7+rng()*2.8;

        const g=ctx.createGain();
        const level=.012+amt*.055+rng()*.025;
        const t=now+k*(.018+rng()*.055);

        g.gain.setValueAtTime(.0001,t);
        g.gain.exponentialRampToValueAtTime(level,t+.002);
        g.gain.exponentialRampToValueAtTime(.0001,t+dur);

        s.connect(hp).connect(bp).connect(g);

        // Mostly dry/nearby, with smaller sends into the shared space.
        g.connect(dryBus);
        const echoSend=ctx.createGain();
        echoSend.gain.value=.12;
        const hallSend=ctx.createGain();
        hallSend.gain.value=.08;
        g.connect(echoSend).connect(echoDelay);
        g.connect(hallSend).connect(hall);

        s.start(t);
        s.stop(t+dur+.02);
      }
    }
    fireCrackle();
  },wait);
}

function scheduleGhost(){
  clearTimeout(ghostTimer);
  if(!started||!ctx)return;
  const density=+$('GHOST').value/100;
  const ent=+$('entropy').value/100;
  const wait=3000+rng()*(17000-density*8500);
  ghostTimer=setTimeout(()=>{
    if(started&&ctx&&ctx.state==='running'&&rng()<.28+density*.55){
      const pitches=[146.83,164.81,196,220,293.66];
      const o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();
      o.type='sine';
      o.frequency.value=pitches[Math.floor(rng()*pitches.length)]/(rng()<.3?2:1);
      f.type='lowpass';f.frequency.value=700+rng()*1400;
      const t=ctx.currentTime,a=1.8+rng()*3.2,d=6+rng()*11,amp=.008+density*.035;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(amp,t+a);
      g.gain.exponentialRampToValueAtTime(.0001,t+a+d);
      o.connect(f).connect(g);routeSource(g);o.start(t);o.stop(t+a+d+.1);
    }
    scheduleGhost();
    fireCrackle();
  },wait*(1-ent*.2));
}

function tick(){
  const ent=+$('entropy').value/100;

  defs.forEach(([n])=>{
    const set=+$(n).value;
    const jitter=.028+Math.pow(ent,1.5)*1.15;
    const pull=.026-ent*.009;

    vals[n]+=(set-vals[n])*pull+(rng()-.5)*jitter;
    vals[n]=Math.max(0,Math.min(100,vals[n]));
    $(n+'Now').textContent=vals[n].toFixed(4);

    // Three small live parameters per generator.
    let m0,m1,m2;
    if(n==='AIR'){
      m0=(0.15+vals[n]/100*.78+(rng()-.5)*ent*.16).toFixed(3);
      m1=Math.round(420+vals[n]*29+(rng()-.5)*ent*420);
      m2=((rng()-.5)*(0.08+ent*.72)).toFixed(3);
    }else if(n==='DRONE'){
      m0=(72.5+vals[n]*.018+(rng()-.5)*ent*.35).toFixed(2);
      m1=((rng()-.5)*(3+ent*21)).toFixed(1);
      m2=(0.20+vals[n]/100*.68+(rng()-.5)*ent*.10).toFixed(3);
    }else if(n==='GHOST'){
      m0=(0.4+vals[n]/100*5.8+(rng()-.5)*ent*.8).toFixed(2);
      m1=(5+vals[n]/100*16+(rng()-.5)*ent*4).toFixed(1);
      m2=(0.10+vals[n]/100*.82+(rng()-.5)*ent*.12).toFixed(3);
    }else{ // PYRO
      m0=(0.25+vals[n]/100*7.0+(rng()-.5)*ent*1.1).toFixed(2);
      m1=Math.round(1800+vals[n]*42+(rng()-.5)*ent*900);
      m2=(1+Math.floor(vals[n]/28+rng()*(1+ent*3))).toFixed(0);
    }

    const values=[m0,m1,m2];
    for(let i=0;i<3;i++){
      const el=$(n+'M'+i);
      if(el){
        const unit=metricDefs[n][i][1];
        el.textContent=values[i]+(unit?' '+unit:'');
      }
    }
  });

  const eJitter=.04+Math.pow(ent,1.55)*1.25;
  vals.entropy+=(+$('entropy').value-vals.entropy)*(.028-ent*.008)+(rng()-.5)*eJitter;
  vals.entropy=Math.max(0,Math.min(100,vals.entropy));
  $('entropyNow').textContent=vals.entropy.toFixed(4);

  if(ctx&&airGain&&droneGain){
    airGain.gain.setTargetAtTime(.006+vals.AIR/100*.105,ctx.currentTime,1.45);
    droneGain.gain.setTargetAtTime(.003+vals.DRONE/100*.065,ctx.currentTime,1.95);
    if(nodes[1])nodes[1].frequency.setTargetAtTime(320+vals.AIR*23,ctx.currentTime,2.25);
  }

  phase+=.0075+ent*.020;
  drawHamster(ent);
}
setInterval(tick,120);

function drawHamster(ent){
  const c=$('core'),x=c.getContext('2d'),w=c.width,h=c.height;
  x.clearRect(0,0,w,h);
  const cx=w/2,cy=h/2+2;
  const chaos=Math.max(0,(ent-.08)/.92),high=Math.pow(chaos,1.45),t=phase*5.8;

  x.save();x.translate(cx,cy);
  x.strokeStyle='rgba(242,238,220,.10)';x.lineWidth=1;
  x.beginPath();x.ellipse(0,0,w*.34,h*.34,0,0,Math.PI*2);x.stroke();
  x.beginPath();x.ellipse(0,0,w*.43,h*.22,.42,0,Math.PI*2);x.stroke();
  x.beginPath();x.ellipse(0,0,w*.39,h*.18,-.55,0,Math.PI*2);x.stroke();

  const driftX=Math.sin(phase*.72)*14+Math.sin(phase*.19)*7;
  const driftY=Math.cos(phase*.53)*9+Math.sin(phase*.31)*5;
  const rot=Math.sin(phase*.34)*.16+phase*(.010+ent*.055)+Math.sin(phase*1.7)*high*.06;
  x.translate(driftX,driftY);x.rotate(rot);
  const sc=1+Math.sin(phase*.8)*.025+Math.sin(phase*2.3)*.012*ent;x.scale(sc,sc);
  const j=()=> (rng()-.5)*(2+14*high);

  x.strokeStyle='rgba(242,238,220,.84)';x.fillStyle='rgba(242,238,220,.94)';x.lineWidth=1.1;
  x.beginPath();x.moveTo(-52+j(),-6+j());
  x.bezierCurveTo(-43+j(),-35+j(),13+j(),-38+j(),55+j(),-15+j());
  x.bezierCurveTo(74+j(),-3+j(),70+j(),26+j(),39+j(),38+j());
  x.bezierCurveTo(8+j(),50+j(),-37+j(),36+j(),-52+j(),13+j());x.closePath();x.stroke();

  x.beginPath();x.moveTo(-50+j(),-15+j());
  x.bezierCurveTo(-70+j(),-23+j(),-82+j(),-12+j(),-78+j(),2+j());
  x.bezierCurveTo(-73+j(),16+j(),-61+j(),19+j(),-47+j(),10+j());x.stroke();

  x.beginPath();x.arc(-48+j(),-29+j(),9+high*2,0,Math.PI*2);x.stroke();
  x.fillStyle='rgba(242,238,220,.95)';
  x.beginPath();x.arc(-64+j()*.12,-10+j()*.12,2.6,0,Math.PI*2);x.fill();
  x.beginPath();x.arc(-79+j()*.12,1+j()*.12,1.8,0,Math.PI*2);x.fill();

  x.strokeStyle='rgba(242,238,220,.42)';
  [-1,0,1].forEach(k=>{x.beginPath();x.moveTo(-73,-2+k*3);x.lineTo(-99-rng()*14*high,-8+k*7+(rng()-.5)*12*high);x.stroke()});

  x.strokeStyle='rgba(242,238,220,.64)';
  x.beginPath();x.moveTo(57+j()*.2,5+j()*.2);x.bezierCurveTo(86+j(),-5+j(),88+j(),16+j(),71+j(),21+j());x.stroke();

  const speed=1.3+ent*3.3,k1=Math.sin(t*speed),k2=Math.sin(t*speed+Math.PI);
  function paddle(x0,y0,kick,front,offset){
    const swing=kick*(13+ent*14)+(rng()-.5)*20*high;
    const lift=Math.cos(t*(1.1+ent*1.8)+offset)*8;
    x.beginPath();x.moveTo(x0+j()*.18,y0+j()*.18);
    x.lineTo(x0+swing*.45,y0+10+lift);
    x.lineTo(x0+swing,y0+18+lift+(rng()-.5)*12*high);
    if(front)x.lineTo(x0+swing+7,y0+17+lift);x.stroke();
  }
  x.strokeStyle='rgba(242,238,220,.80)';
  paddle(-27,18,k1,false,.1);paddle(-6,24,k2,false,1.2);paddle(22,22,k1,true,2.3);paddle(44,15,k2,true,3.0);

  const paw=Math.sin(t*(1.9+ent*2.2))*10;
  x.beginPath();x.moveTo(-18,0);x.lineTo(-6+paw,9+(rng()-.5)*8*high);x.lineTo(-1+paw,5+(rng()-.5)*8*high);x.stroke();

  const bp=[[-45,-10],[-20,-28],[10,-31],[39,-18],[55,2],[38,28],[8,38],[-22,29],[-42,12],[-7,2],[25,4]];
  x.strokeStyle='rgba(242,238,220,.19)';
  for(let a=0;a<bp.length;a++)for(let b=a+1;b<bp.length;b++)if(((a*7+b*11+seed)%10)<2){x.beginPath();x.moveTo(bp[a][0]+j()*.35,bp[a][1]+j()*.35);x.lineTo(bp[b][0]+j()*.35,bp[b][1]+j()*.35);x.stroke()}
  x.restore();

  const particles=14+Math.floor(ent*70);
  x.strokeStyle='rgba(242,238,220,.35)';x.fillStyle='rgba(242,238,220,.48)';
  for(let i=0;i<particles;i++){
    const a=rng()*Math.PI*2,rr=50+rng()*(85+high*65),px=Math.cos(a+phase*.11)*rr,py=Math.sin(a+phase*.11)*rr*.68;
    if(rng()<.62)x.fillRect(px,py,1.15,1.15);
    else{const sz=2+rng()*8*high;x.beginPath();x.moveTo(px-sz,py);x.lineTo(px,py-sz*.55);x.lineTo(px+sz,py);x.stroke()}
  }
  if(ent>.38){
    const n=Math.floor((ent-.38)*55);x.strokeStyle='rgba(242,238,220,.24)';
    for(let i=0;i<n;i++){const px=(rng()-.5)*w*.80,py=(rng()-.5)*h*.68;x.beginPath();x.moveTo(px,py);x.lineTo(px+(rng()-.5)*52*high,py+(rng()-.5)*52*high);x.stroke()}
  }
  x.restore();
}

['space','echo','hall','volume'].forEach(id=>{
  $(id).addEventListener('input',e=>{
    $(id+'V').textContent=e.target.value;
    updateFX();
  });
});

$('start').addEventListener('click',async()=>{
  if(!started){
    if(!await ensureAudio())return;
    started=true;startTime=Date.now();
    $('start').textContent='Ⅱ PAUSE';
    scheduleGhost();
    clearInterval(timer);
    timer=setInterval(()=>{
      const s=Math.floor((Date.now()-startTime)/1000);
      $('clock').textContent=[s/3600,s/60%60,s%60]
        .map(v=>String(Math.floor(v)).padStart(2,'0')).join(':');
    },1000);
  }else if(ctx&&ctx.state==='running'){
    await ctx.suspend();
    $('start').textContent='▶ RESUME';
  }else if(ctx){
    await ctx.resume();
    $('start').textContent='Ⅱ PAUSE';
  }
});
