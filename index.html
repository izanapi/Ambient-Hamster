<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#173d22">
<title>HAMBIENT HM-001</title>
<style>
:root{
  --bg:#173f24;
  --ink:#f2eedc;
  --dim:#a9b79c;
  --line:rgba(242,238,220,.30);
  --faint:rgba(242,238,220,.10);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#102d19;color:var(--ink);font-family:"Courier New",monospace}
body{-webkit-text-size-adjust:100%;overflow:hidden}
#app{
  width:100%;max-width:520px;height:100svh;margin:auto;
  padding:calc(12px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom));
  background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;
}
#app:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px);
}
header{
  position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;
  border-bottom:1px solid var(--line);padding-bottom:8px;flex:0 0 auto;
}
h1{font-weight:400;font-size:15px;letter-spacing:.15em;margin:0}
.micro{font-size:8px;color:var(--dim);letter-spacing:.09em;line-height:1.45}
.status{
  display:flex;align-items:stretch;justify-content:flex-end;
  text-align:right;color:var(--dim);white-space:nowrap;
}
.transport{
  display:flex;align-items:stretch;
  border-left:1px solid var(--line);
  border-right:1px solid var(--line);
  min-height:38px;
}
.topStart,.reroll{
  appearance:none;-webkit-appearance:none;
  background:transparent;color:var(--ink);
  border:0;border-right:1px solid var(--line);
  padding:0 12px;margin:0;
  font:10px "Courier New",monospace;
  letter-spacing:.12em;
  min-height:38px;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  white-space:nowrap;
}
.reroll{border-right:0}
.topStart:active,.reroll:active{
  background:rgba(242,238,220,.09);
  opacity:.72;
}
.seedReadout{
  display:flex;align-items:center;gap:4px;
  font-size:6.2px;letter-spacing:.07em;color:var(--dim);
  border-right:1px solid var(--line);
  padding:0 8px;
}
.seedReadout b{
  font-weight:400;color:var(--ink);letter-spacing:.05em;
}
.clockBox{
  display:flex;align-items:center;gap:4px;
  font-size:6.2px;letter-spacing:.07em;color:var(--dim);
  padding:0 0 0 8px;
}
.clockBox #clock{color:var(--ink);font-size:7.2px}
@media(max-width:390px){
  .topStart,.reroll{font-size:9px;padding:0 9px;min-height:38px}
  .seedReadout{font-size:5.4px;padding:0 6px}
  .clockBox{font-size:5.4px;padding-left:6px}
  .clockBox #clock{font-size:6.4px}
}

.main{
  position:relative;z-index:2;display:grid;grid-template-columns:42% 58%;gap:10px;
  min-height:0;flex:1;padding-top:10px;
}
.left{
  display:flex;flex-direction:column;justify-content:space-between;
  border-right:1px solid var(--line);padding-right:12px;min-height:0;
}
.param{min-height:0;padding:3px 0 5px}
.param input[type=range], .spaceRow input[type=range], .fx input[type=range], .entSlider{
  padding:12px 0;
  margin:-12px 0;
  box-sizing:content-box;
}
.ph{display:flex;justify-content:space-between;align-items:end;margin-bottom:1px}
.pname{font-size:10px;letter-spacing:.14em}
.pval{font-size:10px;font-variant-numeric:tabular-nums}
.desc{font-size:5.4px;color:var(--dim);letter-spacing:.05em;margin-bottom:2px}
.hist{height:31px;overflow:hidden;white-space:normal;font-size:6.2px;line-height:1.35;color:var(--dim);margin-top:5px;word-spacing:4px}

/* thin instrument slider */
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0;
  touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer;
  position:relative;
}
input[type=range]::-webkit-slider-runnable-track{
  height:1px;background:var(--ink);
  background-image:repeating-linear-gradient(90deg,transparent 0 9px,var(--line) 9px 10px);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:8px;height:13px;border-radius:0;
  background:var(--ink);border:1px solid var(--bg);margin-top:-6px;
}
input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:7px;height:12px;border-radius:0;border:none;background:var(--ink)}

.right{
  min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 2px;
}
.entLabel{font-size:9px;letter-spacing:.38em;color:var(--ink);margin-bottom:1px}
.entVal{font-size:25px;letter-spacing:.07em;font-variant-numeric:tabular-nums;margin-bottom:0}
#core{display:block;width:100%;height:min(33vh,260px);min-height:170px}
.entSlider{width:86%!important;margin-top:-3px!important}
.order{width:86%;display:flex;justify-content:space-between;font-size:6.5px;color:var(--dim);letter-spacing:.12em}
.entHist{width:86%;text-align:center;height:9px;margin-top:2px}

.bottom{
  position:relative;z-index:2;flex:0 0 auto;border-top:1px solid var(--line);padding-top:7px;
}
.spaceRow{display:grid;grid-template-columns:54px 1fr 28px;gap:8px;align-items:center;margin-bottom:7px}
.spaceRow label{font-size:9px;letter-spacing:.18em}
.spaceRow .num{text-align:right;font-size:9px}

.fx{
  display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.fxcell{padding:6px 8px 5px;min-width:0}
.fxcell+.fxcell{border-left:1px solid var(--line)}
.fxhead{display:flex;justify-content:space-between;font-size:8px;letter-spacing:.09em;margin-bottom:3px}
.fx input[type=range]{height:14px}
.fx input[type=range]::-webkit-slider-thumb{width:7px;height:11px;margin-top:-5px}

footer{
  display:flex;justify-content:space-between;margin-top:3px;font-size:6.5px;color:var(--dim);letter-spacing:.08em
}

/* short iPhones */
@media(max-height:740px){

  #app{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:calc(7px + env(safe-area-inset-bottom))}
  #core{height:27vh;min-height:145px}
  .hist{display:none}
  .desc{margin-bottom:4px}
  .controls{margin-top:4px}
  button{min-height:27px}
}
</style>

<style>
/* v1.5.4 compact telemetry override */
.left .param{
  overflow:hidden !important;
  padding:2px 0 3px !important;
}
.left .metrics{
  display:grid !important;
  grid-template-columns:repeat(3,minmax(0,1fr)) !important;
  gap:2px !important;
  margin-top:1px !important;
  height:15px !important;
  overflow:hidden !important;
}
.left .metric{
  min-width:0 !important;
  height:14px !important;
  padding-top:1px !important;
  border-top:1px solid var(--faint) !important;
  overflow:hidden !important;
}
.left .metric .mk{
  display:inline !important;
  font-size:3.2px !important;
  line-height:1 !important;
  letter-spacing:.03em !important;
  color:var(--dim) !important;
  white-space:nowrap !important;
}
.left .metric .mv{
  display:inline !important;
  margin-left:2px !important;
  font-size:3.5px !important;
  line-height:1 !important;
  letter-spacing:0 !important;
  color:var(--dim) !important;
  white-space:nowrap !important;
  font-variant-numeric:tabular-nums !important;
}
.left .ph{margin-bottom:0 !important}
.left .desc{margin-bottom:1px !important}
</style>


<style>
/* v1.6.0 generator rack */
.left{
  display:grid !important;
  grid-template-rows:repeat(5,minmax(0,1fr)) !important;
  gap:0 !important;
  justify-content:stretch !important;
  align-content:stretch !important;
}
.left .param{
  min-height:0 !important;
  height:auto !important;
  padding:5px 8px 4px 12px !important;
  border-bottom:1px solid var(--line) !important;
  overflow:hidden !important;
  display:grid !important;
  grid-template-rows:auto auto 20px auto !important;
  align-content:center !important;
}
.left .param:first-child{border-top:1px solid var(--line) !important}
.left .ph{margin:0 0 1px !important}
.left .pname{font-size:9px !important}
.left .pval{font-size:9px !important}
.left .desc{font-size:4.6px !important;margin:0 0 1px !important}
.left .metrics{
  height:13px !important;
  margin-top:1px !important;
}
.left .metric{height:12px !important}
.left .metric .mk{font-size:3px !important}
.left .metric .mv{font-size:3.3px !important}
.left .param input[type=range]{
  align-self:center !important;
}
</style>

<style>
/* Responsive shell: allow the full instrument to remain reachable at any viewport. */
html,body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
#app{
  width:min(100%, 960px);
  max-width:960px;
  height:auto;
  min-height:100dvh;
  overflow:visible;
  padding-inline:max(12px, env(safe-area-inset-left), env(safe-area-inset-right));
}
@media (min-width:700px){
  #app{padding-inline:24px}
  .main{grid-template-columns:minmax(300px,.9fr) minmax(360px,1.1fr)}
  #core{height:min(42vh,360px)}
}
@media (max-width:620px){
  #app{padding-inline:10px}
  header{align-items:flex-start;flex-wrap:wrap}
  .status,.transport{width:100%}
  .transport{display:grid;grid-template-columns:minmax(82px,1fr) minmax(88px,1fr) auto auto}
  .clockBox,.seedReadout{justify-content:center;padding-inline:5px}
  .topStart,.reroll{padding-inline:8px}
  .main{grid-template-columns:1fr;gap:12px}
  .left{border-right:0;padding-right:0;grid-template-rows:repeat(5,auto) !important}
  .left .param{min-height:82px !important}
  .right{min-height:330px}
  #core{height:min(42vh,300px);min-height:210px}
}
@media (max-width:380px){
  #app{padding-inline:7px}
  .transport{grid-template-columns:1fr 1fr}
  .clockBox,.seedReadout{min-height:34px;border-bottom:1px solid var(--line)}
  .topStart,.reroll{min-height:38px}
  .fx{grid-template-columns:1fr}
  .fxcell+.fxcell{border-left:0;border-top:1px solid var(--line)}
  .spaceRow{grid-template-columns:50px minmax(0,1fr) 26px}
}
@media (orientation:landscape) and (max-height:560px){
  #app{max-width:100%;min-height:100%;padding-top:8px}
  header{flex-wrap:nowrap}
  .status,.transport{width:auto}
  .main{grid-template-columns:minmax(300px,.95fr) minmax(340px,1.05fr);min-height:330px}
  .left{border-right:1px solid var(--line);padding-right:12px}
  #core{height:240px;min-height:190px}
}
</style>
</head>
<body>
<main id="app">
<header>
  <div>
    <h1>HAMBIENT</h1>
    <div class="micro">HM-001 / PROCEDURAL FIELD</div>
  </div>
  <div class="status">
    <div class="transport">
      <span class="clockBox">TIME <span id="clock">00:00:00</span></span>
      <span class="seedReadout">SEED <b id="seedValue">--------</b></span>
      <button id="reroll" class="reroll" aria-label="Reroll seed">⚄ REROLL</button>
      <button id="start" class="topStart">▶ PLAY</button>
    </div>
  </div>
</header>

<section class="main">
  <div class="left" id="params"></div>

  <div class="right">
    <div class="entLabel">ENTROPY</div>
    <div class="entVal" id="entropyNow">0.430000</div>
    <canvas id="core" width="300" height="280"></canvas>
    <input class="entSlider" id="entropy" type="range" min="0" max="100" value="43">
    <div class="hist entHist" id="entropyHist"></div>
  </div>
</section>

<section class="bottom">
  <div class="spaceRow">
    <label>DISTANCE</label>
    <input id="distance" type="range" min="0" max="100" value="10">
    <span class="num" id="distanceV">10</span>
  </div>

  <div class="fx">
    <div class="fxcell">
      <div class="fxhead"><span>ECHO</span><span id="echoV">0</span></div>
      <input id="echo" type="range" min="0" max="100" value="0">
    </div>
    <div class="fxcell">
      <div class="fxhead"><span>HALL</span><span id="hallV">10</span></div>
      <input id="hall" type="range" min="0" max="100" value="10">
    </div>
    <div class="fxcell">
      <div class="fxhead"><span>VOLUME</span><span id="volumeV">78</span></div>
      <input id="volume" type="range" min="0" max="100" value="78">
    </div>
  </div>

  <footer><span>ver. 2.3.3</span><span>HM-001</span></footer>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const defs=[['TIDAL','tidal noise field',10],['DRONE','harmonic field',35],['GHOST','rare events',18],['PYRO','spark events',16],['HUM','mains resonance',12]];
const metricDefs={
  TIDAL:[['SURGE',''],['FOAM','Hz'],['TIDE','s']],
  DRONE:[['ROOT','Hz'],['DETUNE','ct'],['DENS','']],
  GHOST:[['RATE','/m'],['DECAY','s'],['DEPTH','']],
  PYRO:[['RATE','/s'],['BRIGHT','Hz'],['BURST','']],
  HUM:[['MAINS','Hz'],['BUZZ',''],['DRIFT','ct']]
};

const holder=$('params');

defs.forEach(([n,s,v])=>{
  holder.insertAdjacentHTML('beforeend',`
  <section class="param">
    <div class="ph"><span class="pname">${n}</span><span class="pval" id="${n}Now">${v.toFixed(4)}</span></div>
    <div class="desc">${s}</div>
    <input id="${n}" type="range" min="0" max="100" value="${v}">
    <div class="metrics" id="${n}Metrics"></div>

  </section>`);
});
defs.forEach(([n])=>{
  const m=$(n+'Metrics');
  if(m){
    m.innerHTML=metricDefs[n].map((d,i)=>`<div class="metric"><div class="mk">${d[0]}</div><div class="mv" id="${n}M${i}">--</div></div>`).join('');
  }
});

let ctx=null, master=null, comp=null, spacePan=null, spaceEarly=null, spaceEarlyGain=null, spaceEarlyTap2=null, spaceEarlyGain2=null;
let dryBus=null, spaceFilter=null, echoTone=null, hallTone=null, dryInput=null, echoInput=null, hallInput=null;
let echoDelay=null, echoFeedback=null, echoWet=null;
let hall=null, hallWet=null;
let airGain=null, droneGain=null, droneOscs=[], waveGain=null, waveFilter=null, waveLfo=null, waveLfoGain=null, waveSource=null, humGain=null, humOsc1=null, humOsc2=null, humLfo=null, humLfoGain=null, humCut=null, humDropTimer=null;
let started=false,startTime=0,timer=null,ghostTimer=null,crackleTimer=null;
function freshSeed(){
  if(globalThis.crypto&&crypto.getRandomValues){
    const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]>>>0;
  }
  return (Math.random()*0xffffffff)>>>0;
}
let baseSeed=freshSeed(),seed=baseSeed,phase=0,nodes=[];
let vals={TIDAL:10,DRONE:35,GHOST:18,PYRO:16,HUM:12,entropy:43};

function rng(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}
function seedHex(v){return (v>>>0).toString(16).toUpperCase().padStart(8,'0')}
function showSeed(){const el=$('seedValue');if(el)el.textContent=seedHex(baseSeed)}
function rerollSeed(){
  baseSeed=freshSeed();
  seed=baseSeed;
  phase=(baseSeed/4294967296)*Math.PI*2;
  showSeed();

  // REROLL now changes the actual generator controls.
  // Generator parameters glide to their newly rolled destinations.
  // The visible controls and their audio targets travel together, avoiding abrupt jumps.
  defs.forEach(([n])=>{
    let target=Math.round(5+rng()*90);
    if(n==='TIDAL') target=Math.round(2+rng()*38);

    const el=$(n);
    if(!el)return;

    const start=+el.value;
    const duration=1400+rng()*900; // each machine drifts for roughly 1.4–2.3 s
    const t0=performance.now();

    const glide=(now)=>{
      const p=Math.min(1,(now-t0)/duration);
      // smoothstep: gentle departure and arrival
      const ease=p*p*(3-2*p);
      const v=start+(target-start)*ease;

      el.value=v;
      vals[n]=v;
      const readout=$(n+'Now');
      if(readout) readout.textContent=v.toFixed(4);

      if(p<1){
        requestAnimationFrame(glide);
      }else{
        el.value=target;
        vals[n]=target;
        if(readout) readout.textContent=target.toFixed(4);
      }
    };
    requestAnimationFrame(glide);
  });

  // ENTROPY is part of the reroll too.
  // Full 0-100 range means the hamster can jump from calm to catastrophic.
  const entEl=$('entropy');
  if(entEl){
    const ev=Math.round(rng()*100);
    entEl.value=ev;
    vals.entropy=ev;
    $('entropyNow').textContent=Math.min(.999999,ev/100).toFixed(6);
    entEl.dispatchEvent(new Event('input',{bubbles:true}));
  }

  // Re-seed continuous random textures while running.
  if(ctx){
    try{if(hall)hall.buffer=makeHallIR()}catch(e){}
  }
}
function noiseBuffer(sec=2){
  const b=ctx.createBuffer(1,Math.floor(ctx.sampleRate*sec),ctx.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=rng()*2-1;
  return b;
}
function makeHallIR(seconds=10.5,decay=2.0){
  const len=Math.floor(ctx.sampleRate*seconds),b=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=b.getChannelData(ch);
    for(let i=0;i<len;i++){
      const t=i/len;
      const early=i<ctx.sampleRate*.16 ? (1-i/(ctx.sampleRate*.16))*.30 : 0;
      const tail=Math.pow(1-t,decay);
      d[i]=(rng()*2-1)*(tail+early*.22);
    }
  }
  return b;
}
function routeSource(node){
  node.connect(dryInput);
  node.connect(echoInput);
  node.connect(hallInput);
}
function initAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)throw new Error('WEB AUDIO UNAVAILABLE');
  ctx=new AC();

  // MASTER loudness stage followed by a gentle peak safety limiter.
  // This gives roughly +6 dB more useful output than the previous build,
  // while catching unusually hot REROLL / FX combinations before the device output.
  master=ctx.createGain();
  master.gain.value=.90;

  comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-5.5;
  comp.knee.value=3.0;
  comp.ratio.value=18;
  comp.attack.value=.003;
  comp.release.value=.18;

  master.connect(comp);
  comp.connect(ctx.destination);

  // Source-input gates. STOP closes these, but leaves effect outputs alive
  // so echo and hall tails can decay naturally.
  dryInput=ctx.createGain();
  echoInput=ctx.createGain();
  hallInput=ctx.createGain();
  dryInput.gain.value=1;
  echoInput.gain.value=1;
  hallInput.gain.value=1;

  // DISTANCE tone filters for wet paths too.
  echoTone=ctx.createBiquadFilter();
  echoTone.type='lowpass';
  echoTone.frequency.value=14500;
  echoTone.Q.value=.30;

  hallTone=ctx.createBiquadFilter();
  hallTone.type='lowpass';
  hallTone.frequency.value=14500;
  hallTone.Q.value=.30;

  dryBus=ctx.createGain();
  dryInput.connect(dryBus);

  spaceFilter=ctx.createBiquadFilter();
  spaceFilter.type='lowpass';spaceFilter.frequency.value=4200;spaceFilter.Q.value=.25;

  // SPACE: distance + stereo drift + early reflections
  spacePan=ctx.createStereoPanner();
  dryBus.connect(spaceFilter).connect(spacePan).connect(master);

  spaceEarly=ctx.createDelay(0.25);
  spaceEarlyTap2=ctx.createDelay(0.35);
  spaceEarlyGain=ctx.createGain();
  spaceEarlyGain2=ctx.createGain();
  dryBus.connect(spaceEarly).connect(spaceEarlyGain).connect(master);
  dryBus.connect(spaceEarlyTap2).connect(spaceEarlyGain2).connect(master);

  echoDelay=ctx.createDelay(2.5);
  echoInput.connect(echoTone).connect(echoDelay);
  echoFeedback=ctx.createGain();
  echoWet=ctx.createGain();
  echoDelay.connect(echoFeedback);
  echoFeedback.connect(echoDelay);
  echoDelay.connect(echoWet);
  echoWet.connect(master);

  hall=ctx.createConvolver();
  hallInput.connect(hallTone).connect(hall);
  hall.buffer=makeHallIR();
  hallWet=ctx.createGain();
  hall.connect(hallWet);
  hallWet.connect(master);

  // TIDAL: filtered broadband surf with a slow amplitude tide.
  const src=ctx.createBufferSource();
  waveSource=src;
  src.buffer=noiseBuffer();src.loop=true;

  waveFilter=ctx.createBiquadFilter();
  waveFilter.type='bandpass';
  waveFilter.frequency.value=700;
  waveFilter.Q.value=.32;

  waveGain=ctx.createGain();
  waveGain.gain.value=.42;

  airGain=ctx.createGain();
  airGain.gain.value=0;

  waveLfo=ctx.createOscillator();
  waveLfo.type='sine';
  waveLfo.frequency.value=.065;

  waveLfoGain=ctx.createGain();
  waveLfoGain.gain.value=.055;

  src.connect(waveFilter).connect(waveGain).connect(airGain);
  waveLfo.connect(waveLfoGain).connect(waveGain.gain);
  routeSource(airGain);

  src.start();
  waveLfo.start();
  nodes.push(src,waveFilter,waveLfo);

  droneGain=ctx.createGain();droneGain.gain.value=0;
  routeSource(droneGain);
  droneOscs=[];
  [73.42,110,146.83].forEach((f,i)=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=i===0?'triangle':'sine';
    const baseHz=f*(1+(rng()-.5)*.004);
    o.frequency.value=baseHz;
    g.gain.value=[.5,.22,.12][i];
    o.connect(g).connect(droneGain);
    o.start();
    droneOscs.push({osc:o,baseHz});
    nodes.push(o);
  });

  // HUM: low mains-like electrical resonance + slight mechanical wobble
  humGain=ctx.createGain();
  humGain.gain.value=.012;
  humCut=ctx.createGain();
  humCut.gain.value=1;
  humGain.connect(humCut);
  routeSource(humCut);

  humOsc1=ctx.createOscillator();
  humOsc1.type='sine';
  humOsc1.frequency.value=50;

  humOsc2=ctx.createOscillator();
  humOsc2.type='triangle';
  humOsc2.frequency.value=100;

  const humG1=ctx.createGain();
  humG1.gain.value=.72;
  const humG2=ctx.createGain();
  humG2.gain.value=.18;

  humOsc1.connect(humG1).connect(humGain);
  humOsc2.connect(humG2).connect(humGain);

  humLfo=ctx.createOscillator();
  humLfo.type='sine';
  humLfo.frequency.value=.18;
  humLfoGain=ctx.createGain();
  humLfoGain.gain.value=.004;
  humLfo.connect(humLfoGain).connect(humGain.gain);

  humOsc1.start();
  humOsc2.start();
  humLfo.start();
  nodes.push(humOsc1,humOsc2,humLfo);

  updateFX();
}
async function ensureAudio(){
  try{
    if(!ctx||ctx.state==='closed')initAudio();
    if(ctx.state!=='running')await ctx.resume();
    return ctx.state==='running';
  }catch(e){
    console.error(e);
    return false;
  }
}

function scheduleHumDrop(){
  clearTimeout(humDropTimer);
  if(!started||!ctx||!humCut)return;

  const amt=+$('HUM').value/100;
  const ent=+$('entropy').value/100;
  const collapse=Math.pow(Math.max(0,(ent-.62)/.38),2.1);
  const wait=1200+rng()*Math.max(650,7600-amt*3500-ent*2600-collapse*4300);

  humDropTimer=setTimeout(()=>{
    const liveAmt=+$('HUM').value/100;
    if(started&&ctx.state==='running'&&liveAmt>.03&&rng()<Math.min(.94,.16+liveAmt*.42+ent*.28+collapse*.52)){
      const t=ctx.currentTime;
      const dip=.020+rng()*(.10+collapse*.33);
      humCut.gain.cancelScheduledValues(t);
      humCut.gain.setValueAtTime(Math.max(.0001,humCut.gain.value),t);
      humCut.gain.exponentialRampToValueAtTime(.0002,t+.004);
      humCut.gain.exponentialRampToValueAtTime(1,t+dip);

      // tiny electrical transient after the cut
      const b=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.018),ctx.sampleRate);
      const d=b.getChannelData(0);
      for(let i=0;i<d.length;i++){
        const p=i/d.length;
        d[i]=(rng()*2-1)*Math.pow(1-p,3);
      }
      const s=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),g=ctx.createGain();
      s.buffer=b;
      hp.type='highpass';
      hp.frequency.value=900+rng()*1400;
      g.gain.value=.010+liveAmt*.034;
      s.connect(hp).connect(g).connect(dryInput);
      s.start(t+dip*.35);
      s.stop(t+dip*.35+.02);
    }
    scheduleHumDrop();
  },Math.max(900,wait));
}

function updateFX(){
  if(!ctx)return;
  const s=+$('distance').value/100;
  const e=+$('echo').value/100;
  const h=+$('hall').value/100;
  const v=+$('volume').value/100;

  // DISTANCE: deliberately obvious. Direct sound retreats hard,
  // loses high frequencies, and reflections take over.
  const d=Math.pow(s,1.12);
  const direct=Math.max(.12,1-d*.88);
  const cutoff=16000*Math.pow(0.025,d); // ~16 kHz near -> ~400 Hz far

  [spaceFilter,echoTone,hallTone].forEach(f=>{
    if(!f)return;
    f.frequency.setTargetAtTime(cutoff,ctx.currentTime,.20);
    f.Q.setTargetAtTime(.32+d*.88,ctx.currentTime,.20);
  });
  dryBus.gain.setTargetAtTime(direct,ctx.currentTime,.22);

  if(spaceEarly){
    spaceEarly.delayTime.setTargetAtTime(.012+d*.115,ctx.currentTime,.25);
    spaceEarlyGain.gain.setTargetAtTime(d*.56,ctx.currentTime,.18);
  }
  if(spaceEarlyTap2){
    spaceEarlyTap2.delayTime.setTargetAtTime(.027+d*.205,ctx.currentTime,.25);
    spaceEarlyGain2.gain.setTargetAtTime(d*.40,ctx.currentTime,.18);
  }

  // ECHO remains its own control.
  const ec=Math.pow(e,1.18);
  echoDelay.delayTime.setTargetAtTime(.09+ec*1.42,ctx.currentTime,.18);
  echoFeedback.gain.setTargetAtTime(Math.min(.945,ec*.975),ctx.currentTime,.18);
  echoWet.gain.setTargetAtTime(ec*1.05,ctx.currentTime,.16);

  // HALL remains independent, but distant sources naturally feed more room.
  const hc=Math.pow(h,.74);
  hallWet.gain.setTargetAtTime(hc*1.42+d*.78,ctx.currentTime,.18);

  master.gain.setTargetAtTime(v*1.897,ctx.currentTime,.10);
}

function fireCrackle(){
  clearTimeout(crackleTimer);
  if(!started||!ctx)return;

  const amt=+$('PYRO').value/100;
  const ent=+$('entropy').value/100;

  // PYRO = fire activity, not merely loudness.
  // Zero is truly silent. Higher values shorten the gap dramatically.
  if(amt<=.001){
    crackleTimer=setTimeout(fireCrackle,260);
    return;
  }

  const density=Math.pow(amt,.72);
  const maxRush=Math.pow(Math.max(0,(amt-.72)/.28),1.65);

  // Approximate feel:
  // low:    ...pat..........pat...
  // middle: pat...pachi..pat......
  // max:    pachipachichipachi...
  const minGap=18;
  const baseGap=1450*Math.pow(1-density,2.05)+38;
  const wait=Math.max(minGap,baseGap*(.46+rng()*.92)*(1-ent*.16)*(1-maxRush*.48));

  crackleTimer=setTimeout(()=>{
    if(!started||!ctx||ctx.state!=='running'){
      fireCrackle();
      return;
    }

    // Read the current slider again so dropping PYRO to zero stops immediately.
    const liveAmt=+$('PYRO').value/100;
    if(liveAmt<=.001){
      fireCrackle();
      return;
    }

    const liveEnt=+$('entropy').value/100;
    const liveDensity=Math.pow(liveAmt,.72);
    const liveRush=Math.pow(Math.max(0,(liveAmt-.72)/.28),1.55);
    const now=ctx.currentTime;

    // Campfire-like small groups: single "pachi", occasional "pachichi".
    let cluster=1;
    if(rng()<.12+liveDensity*.58) cluster++;
    if(rng()<liveDensity*.34+liveRush*.30) cluster++;
    if(rng()<liveRush*.52) cluster+=1+Math.floor(rng()*3);

    for(let k=0;k<cluster;k++){
      const dur=.018+rng()*(.055+liveDensity*.050);
      const b=ctx.createBuffer(1,Math.max(16,Math.floor(ctx.sampleRate*dur)),ctx.sampleRate);
      const d=b.getChannelData(0);

      // Crack with several tiny internal impulses, giving "pachi" instead of a thin click.
      const sparks=1+Math.floor(rng()*(2+liveDensity*5+liveRush*7));
      for(let sidx=0;sidx<sparks;sidx++){
        const pos=Math.floor(rng()*Math.max(1,d.length-12));
        const len=Math.min(d.length-pos,8+Math.floor(rng()*70));
        const amp=.35+rng()*.75;
        for(let i=0;i<len;i++){
          const p=i/len;
          d[pos+i]+=(rng()*2-1)*amp*Math.pow(1-p,2.25);
        }
      }

      const s=ctx.createBufferSource();
      s.buffer=b;

      // Wider than before: still a crackle, but no longer an inaudibly thin ultrasonic tick.
      const hp=ctx.createBiquadFilter();
      hp.type='highpass';
      hp.frequency.value=850+rng()*1250;
      hp.Q.value=.18+rng()*.50;

      const peak=ctx.createBiquadFilter();
      peak.type='peaking';
      peak.frequency.value=1800+rng()*3600;
      peak.Q.value=.45+rng()*1.25;
      peak.gain.value=2+rng()*5;

      const g=ctx.createGain();
      // Wide per-hit dynamics: tiny embers, normal snaps, occasional strong pops.
      // PYRO still primarily controls density, not the average output level.
      const accent=Math.pow(rng(),1.65);
      let level=.018+liveDensity*.025+liveRush*.014
        +accent*(.030+liveDensity*.080+liveRush*.030);
      if(rng()<.055+liveDensity*.075) level*=1.35+rng()*.35;
      level=Math.min(.205,level);

      const t=now+k*(.009+rng()*(.030-liveRush*.014));

      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(level,t+.0015);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);

      s.connect(hp).connect(peak).connect(g);

      // Keep PYRO close and present; room sends remain secondary.
      g.connect(dryInput);
      const echoSend=ctx.createGain();
      echoSend.gain.value=.10;
      const hallSend=ctx.createGain();
      hallSend.gain.value=.065;
      g.connect(echoSend).connect(echoInput);
      g.connect(hallSend).connect(hallInput);

      s.start(t);
      s.stop(t+dur+.025);
    }

    fireCrackle();
  },wait);
}

function scheduleGhost(){
  clearTimeout(ghostTimer);
  if(!started||!ctx)return;

  const density=+$('GHOST').value/100;

  // Keep polling lightly so raising the control from zero responds quickly,
  // but zero itself never produces a ghost.
  if(density<=.001){
    ghostTimer=setTimeout(scheduleGhost,420);
    return;
  }

  const ent=+$('entropy').value/100;
  const collapse=Math.pow(Math.max(0,(ent-.62)/.38),2.0);

  // GHOST controls both event probability and spacing.
  const wait=(2100+rng()*(17500-density*13200))*(1-ent*.16-collapse*.12);

  ghostTimer=setTimeout(()=>{
    const live=+$('GHOST').value/100;
    if(started&&ctx&&ctx.state==='running'&&live>.001){
      const liveEnt=+$('entropy').value/100;
      const liveCollapse=Math.pow(Math.max(0,(liveEnt-.62)/.38),2.0);
      const chance=Math.min(.96,.10+live*.76+liveEnt*.08+liveCollapse*.14);

      if(rng()<chance){
        const pitches=[146.83,164.81,196,220,293.66];
        const o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();
        o.type='sine';

        const base=pitches[Math.floor(rng()*pitches.length)]/(rng()<.3?2:1);
        const unstable=1+(rng()-.5)*(liveEnt*.018+liveCollapse*.22);
        o.frequency.value=Math.max(36,base*unstable);

        f.type='lowpass';
        f.frequency.value=650+rng()*1550;

        const t=ctx.currentTime;
        const a=1.4+rng()*3.4;
        const d=5+rng()*12;
        const amp=.010+live*.080;

        g.gain.setValueAtTime(.0001,t);
        g.gain.exponentialRampToValueAtTime(amp,t+a);
        g.gain.exponentialRampToValueAtTime(.0001,t+a+d);

        o.connect(f).connect(g);
        routeSource(g);
        o.start(t);
        o.stop(t+a+d+.1);
      }
    }

    // GHOST owns only its own scheduler.
    scheduleGhost();
  },Math.max(650,wait));
}

function tick(){
  const ent=+$('entropy').value/100;
  const collapse=Math.pow(Math.max(0,(ent-.62)/.38),2.15);

  defs.forEach(([n])=>{
    const set=+$(n).value;
    const jitter=.035+Math.pow(ent,1.5)*1.35;
    const pull=.026-ent*.009;

    if(set<=0){
      vals[n]=0;
    }else{
      vals[n]+=(set-vals[n])*pull+(rng()-.5)*jitter;
      vals[n]=Math.max(0,Math.min(100,vals[n]));
    }
    $(n+'Now').textContent=vals[n].toFixed(4);

    // Three small live parameters per generator.
    let m0,m1,m2;
    if(n==='TIDAL'){
      m0=(0.25+vals[n]/100*1.35+(rng()-.5)*ent*.34).toFixed(3);
      m1=Math.round(1500+vals[n]*38+(rng()-.5)*ent*850);
      m2=(7.5-vals[n]/100*4.2+(rng()-.5)*ent*1.4).toFixed(2);
    }else if(n==='DRONE'){
      const rootDrift=1+(rng()-.5)*(ent*.006+collapse*.12);
      m0=(73.42*rootDrift).toFixed(2);
      m1=((rng()-.5)*(3+ent*21+collapse*34)).toFixed(1);
      m2=(0.20+vals[n]/100*.68+(rng()-.5)*ent*.10).toFixed(3);
    }else if(n==='GHOST'){
      m0=(0.4+vals[n]/100*5.8+(rng()-.5)*ent*.8).toFixed(2);
      m1=(5+vals[n]/100*16+(rng()-.5)*ent*4).toFixed(1);
      m2=(0.10+vals[n]/100*.82+(rng()-.5)*ent*.12).toFixed(3);
    }else if(n==='PYRO'){
      m0=(0.45+Math.pow(vals[n]/100,.62)*34.0+Math.pow(Math.max(0,(vals[n]/100-.66)/.34),1.5)*180+(rng()-.5)*ent*4.0).toFixed(2);
      m1=Math.round(1800+vals[n]*42+(rng()-.5)*ent*900);
      m2=(1+Math.floor(vals[n]/28+rng()*(1+ent*3))).toFixed(0);
    }else{ // HUM
      m0=(49.7+vals[n]/100*.6+(rng()-.5)*ent*.35).toFixed(2);
      m1=(0.12+vals[n]/100*.82+(rng()-.5)*ent*.12).toFixed(3);
      m2=((rng()-.5)*(2.0+ent*14)).toFixed(1);
    }

    const values=[m0,m1,m2];
    for(let i=0;i<3;i++){
      const el=$(n+'M'+i);
      if(el){
        const unit=metricDefs[n][i][1];
        el.textContent=values[i]+(unit?' '+unit:'');
      }
    }
  });

  const eJitter=.04+Math.pow(ent,1.55)*1.25;
  vals.entropy+=(+$('entropy').value-vals.entropy)*(.028-ent*.008)+(rng()-.5)*eJitter;
  vals.entropy=Math.max(0,Math.min(100,vals.entropy));
  $('entropyNow').textContent=Math.min(.999999,Math.max(0,vals.entropy/100)).toFixed(6);

  if(ctx&&airGain&&droneGain){
    const waveAmt=vals.TIDAL/100;
    const loud=Math.min(1,waveAmt*2); // 50 = previous max loudness

    // Above 50, loudness largely plateaus. At zero the source is fully silent.
    const tidalLevel=waveAmt<=0 ? 0 : loud*.030;
    airGain.gain.setTargetAtTime(tidalLevel,ctx.currentTime,.55);

    if(waveGain){
      const base=.40+loud*.08;
      waveGain.gain.setTargetAtTime(base,ctx.currentTime,.75);
    }
    if(waveLfo){
      const rate=.045+waveAmt*.075+ent*.18+collapse*.72;
      waveLfo.frequency.setTargetAtTime(rate,ctx.currentTime,.65);
    }
    if(waveLfoGain){
      // Slow swell depth, deliberately kept below the base gain.
      const agitation=.025+waveAmt*.080+ent*.035+collapse*.11;
      waveLfoGain.gain.setTargetAtTime(waveAmt<=0?0:agitation,ctx.currentTime,.65);
    }
    if(waveFilter){
      const centre=360+waveAmt*1220+(rng()-.5)*(ent*900+collapse*4200);
      waveFilter.frequency.setTargetAtTime(Math.max(160,centre),ctx.currentTime,.75);
      waveFilter.Q.setTargetAtTime(.24+waveAmt*.18+ent*.58+collapse*4.2,ctx.currentTime,.35);
    }

    const droneAmt=vals.DRONE/100;
    const droneWobble=Math.max(.20,1+(rng()-.5)*collapse*.72);
    droneGain.gain.setTargetAtTime(
      droneAmt<=0 ? 0 : droneAmt*.140*droneWobble,
      ctx.currentTime,.18+(.70-ent*.48)
    );

    // Entropy bends each oscillator around its fixed home pitch.
    // It can become badly detuned, but it never permanently random-walks away.
    if(droneOscs&&droneOscs.length){
      droneOscs.forEach(({osc,baseHz})=>{
        if(!osc||!osc.frequency)return;
        const ratio=1+(rng()-.5)*(ent*.006+collapse*.19);
        osc.frequency.setTargetAtTime(
          Math.max(18,baseHz*ratio),
          ctx.currentTime,.16+(.30-collapse*.16)
        );
      });
    }

    if(humGain&&humOsc1&&humOsc2){
      const humAmt=vals.HUM/100;
      humGain.gain.setTargetAtTime(humAmt<=0?0:humAmt*.105,ctx.currentTime,.35);
      const mains=49.85+(rng()-.5)*(ent*.28+collapse*9.0);
      humOsc1.frequency.setTargetAtTime(mains,ctx.currentTime,.9);
      humOsc2.frequency.setTargetAtTime(Math.max(25,mains*2+(rng()-.5)*(ent*.9+collapse*26)),ctx.currentTime,.20+(.7-collapse*.5));
      if(humLfo) humLfo.frequency.setTargetAtTime(.10+humAmt*.28+ent*.70+collapse*7.5,ctx.currentTime,.28);
      if(humLfoGain){
        const humMod=humAmt<=0 ? 0 : humAmt*(.003+humAmt*.009+ent*.010+collapse*.045);
        humLfoGain.gain.setTargetAtTime(humMod,ctx.currentTime,.24);
      }
    }
  }

  if(ctx&&spacePan){
    const s=+$('distance').value/100;
    const d=Math.pow(s,1.08);
    const pan=Math.sin(phase*.37)*d*.82 + Math.sin(phase*.11)*d*.16
      +(rng()-.5)*collapse*.95;
    spacePan.pan.setTargetAtTime(Math.max(-1,Math.min(1,pan)),ctx.currentTime,.12+(.45-collapse*.3));
  }

  // Near maximum entropy, the whole source field begins to tear apart.
  // FX outputs are not gated, so echoes/reverb smear the collapse.
  if(ctx&&started&&collapse>.015&&dryInput&&echoInput&&hallInput){
    const t=ctx.currentTime;
    const tearChance=.04+collapse*.52;
    if(rng()<tearChance){
      const keep=Math.max(.025,1-collapse*(.45+rng()*.52));
      [dryInput,echoInput,hallInput].forEach((g,i)=>{
        if(!g)return;
        const skew=i*.004*rng();
        g.gain.cancelScheduledValues(t+skew);
        g.gain.setTargetAtTime(keep,t+skew,.004+collapse*.018);
        g.gain.setTargetAtTime(1,t+skew+.018+rng()*(.03+collapse*.12),.008);
      });
    }
  }

  phase+=.009+ent*.034;
  drawHamster(ent);
}
setInterval(tick,45);

function drawHamster(ent){
  const c=$('core'),x=c.getContext('2d'),w=c.width,h=c.height;
  x.clearRect(0,0,w,h);

  const cx=w/2,cy=h/2+2;
  const chaos=Math.max(0,(ent-.06)/.94);
  const high=Math.pow(chaos,1.35);
  const extreme=Math.pow(chaos,2.25);
  const t=phase*6.2;

  x.save();
  x.translate(cx,cy);

  // =========================================================
  // BACKGROUND FIELD: dense tiny running noise behind all forms
  // =========================================================
  const bgCount=70+Math.floor(ent*190);
  x.fillStyle='rgba(242,238,220,.18)';
  x.strokeStyle='rgba(242,238,220,.12)';
  for(let i=0;i<bgCount;i++){
    const seedA=(i*12.9898 + seed*.000001);
    const a=(rng()*Math.PI*2)+(phase*(.05 + (i%7)*.003));
    const rr=18+rng()*Math.min(w,h)*.54;
    const px=Math.cos(a)*rr + Math.sin(phase*.7+i)*8*high;
    const py=Math.sin(a)*rr*.72 + Math.cos(phase*.4+i*.4)*6*high;

    if(i%4===0){
      // short "running" scan streaks
      const len=2+rng()*(4+ent*14);
      x.beginPath();
      x.moveTo(px-len,py);
      x.lineTo(px+len,py+(rng()-.5)*2*high);
      x.stroke();
    }else{
      const s=.55+rng()*.75;
      x.fillRect(px,py,s,s);
    }
  }

  // faint horizontal scan speckles across full section
  x.strokeStyle='rgba(242,238,220,.055)';
  for(let row=-h*.42;row<h*.42;row+=11){
    const shift=Math.sin(phase*.6+row*.08)*7*high;
    x.beginPath();
    x.moveTo(-w*.46+shift,row);
    x.lineTo(w*.46+shift,row+(rng()-.5)*1.5*high);
    x.stroke();
  }

  // =========================================================
  // ORBITAL RINGS: rotating, trembling, increasingly deformed
  // =========================================================
  function noisyEllipse(rx,ry,rot,squash,alpha,segments=54){
    x.save();
    x.rotate(rot);
    x.strokeStyle=`rgba(242,238,220,${alpha})`;
    x.beginPath();
    for(let i=0;i<=segments;i++){
      const a=i/segments*Math.PI*2;
      const wobble =
        Math.sin(a*5 + phase*2.1)*2.4*chaos +
        Math.sin(a*11 - phase*1.4)*1.2*high +
        (rng()-.5)*9*extreme;
      const px=Math.cos(a)*(rx+wobble);
      const py=Math.sin(a)*(ry+wobble*squash);
      if(i===0)x.moveTo(px,py);else x.lineTo(px,py);
    }
    x.closePath();
    x.stroke();
    x.restore();
  }

  const ringSpin=phase*(.10+ent*.55);
  const ringShake=(rng()-.5)*.035*high;

  noisyEllipse(
    w*.34, h*.34,
    ringSpin + ringShake,
    .7,
    .10 + ent*.08
  );

  noisyEllipse(
    w*.43, h*.22,
    .42 - ringSpin*.72 + Math.sin(phase*.9)*.08*high,
    .55,
    .10 + ent*.10
  );

  noisyEllipse(
    w*.39, h*.18,
    -.55 + ringSpin*1.18 + Math.cos(phase*.7)*.11*high,
    .6,
    .08 + ent*.09
  );

  // orbit ticks that rotate separately
  x.strokeStyle='rgba(242,238,220,.12)';
  const ticks=20+Math.floor(ent*20);
  for(let i=0;i<ticks;i++){
    const a=i/ticks*Math.PI*2 + ringSpin*.85;
    const r=Math.min(w,h)*(.34 + (i%3)*.014);
    const wob=(rng()-.5)*10*extreme;
    x.beginPath();
    x.moveTo(Math.cos(a)*(r+wob),Math.sin(a)*(r+wob));
    x.lineTo(Math.cos(a)*(r+3+wob),Math.sin(a)*(r+3+wob));
    x.stroke();
  }

  // =========================================================
  // HAMSTER TRANSFORM: float -> tumble -> violent loss of form
  // =========================================================
  const driftX=
    Math.sin(phase*.72)*14 +
    Math.sin(phase*.19)*7 +
    Math.sin(phase*2.7)*24*extreme;

  const driftY=
    Math.cos(phase*.53)*9 +
    Math.sin(phase*.31)*5 +
    Math.cos(phase*2.15)*20*extreme;

  // low entropy = gentle roll, high entropy = continuous tumbling
  const rot=
    Math.sin(phase*.34)*.18 +
    phase*(.012 + ent*.16) +
    Math.sin(phase*1.7)*high*.14 +
    Math.sin(phase*3.8)*extreme*.40;

  x.translate(driftX,driftY);
  x.rotate(rot);

  // asymmetric scale at high entropy makes the body stop holding shape
  const sx=
    1 +
    Math.sin(phase*.8)*.025 +
    Math.sin(phase*2.3)*.018*ent +
    Math.sin(phase*4.5)*.20*extreme;

  const sy=
    1 +
    Math.cos(phase*.67)*.020 +
    Math.sin(phase*3.2)*.012*ent -
    Math.sin(phase*4.1)*.16*extreme;

  x.scale(sx,sy);

  // jitter amplitude grows brutally at the top
  const jAmp=1.5 + 15*high + 34*extreme;
  const j=()=> (rng()-.5)*jAmp;

  x.strokeStyle='rgba(242,238,220,.84)';
  x.fillStyle='rgba(242,238,220,.94)';
  x.lineWidth=1.05;

  // body
  x.beginPath();
  x.moveTo(-52+j(),-6+j());
  x.bezierCurveTo(-43+j(),-35+j(),13+j(),-38+j(),55+j(),-15+j());
  x.bezierCurveTo(74+j(),-3+j(),70+j(),26+j(),39+j(),38+j());
  x.bezierCurveTo(8+j(),50+j(),-37+j(),36+j(),-52+j(),13+j());
  x.closePath();
  x.stroke();

  // head
  x.beginPath();
  x.moveTo(-50+j(),-15+j());
  x.bezierCurveTo(-70+j(),-23+j(),-82+j(),-12+j(),-78+j(),2+j());
  x.bezierCurveTo(-73+j(),16+j(),-61+j(),19+j(),-47+j(),10+j());
  x.stroke();

  // ear
  x.beginPath();
  x.arc(-48+j(),-29+j(),9+high*3,0,Math.PI*2);
  x.stroke();

  // eye + nose
  x.fillStyle='rgba(242,238,220,.95)';
  x.beginPath();x.arc(-64+j()*.16,-10+j()*.16,2.6,0,Math.PI*2);x.fill();
  x.beginPath();x.arc(-79+j()*.16,1+j()*.16,1.8,0,Math.PI*2);x.fill();

  // whiskers become unstable vectors
  x.strokeStyle='rgba(242,238,220,.42)';
  [-1,0,1].forEach(k=>{
    x.beginPath();
    x.moveTo(-73+j()*.1,-2+k*3+j()*.1);
    x.lineTo(
      -99-rng()*(14+38*extreme),
      -8+k*7+(rng()-.5)*(12+42*extreme)
    );
    x.stroke();
  });

  // tail
  x.strokeStyle='rgba(242,238,220,.64)';
  x.beginPath();
  x.moveTo(57+j()*.2,5+j()*.2);
  x.bezierCurveTo(
    86+j(),-5+j(),
    88+j(),16+j(),
    71+j(),21+j()
  );
  x.stroke();

  // =========================================================
  // LIMBS: frantic paddling that accelerates with entropy
  // =========================================================
  const speed=1.4 + ent*7.0;
  const k1=Math.sin(t*speed);
  const k2=Math.sin(t*speed+Math.PI);

  // Straight rod limbs, no visible joints.
  function rodLeg(x0,y0,kick,offset,len=24){
    const ang =
      kick*(.48+ent*.65) +
      Math.sin(t*.9+offset)*.18 +
      (rng()-.5)*.72*extreme;
    const L=len + (rng()-.5)*12*extreme;
    const x1=x0 + Math.cos(ang)*L;
    const y1=y0 + Math.sin(ang)*L;
    x.beginPath();
    x.moveTo(x0+j()*.10,y0+j()*.10);
    x.lineTo(x1+j()*.10,y1+j()*.10);
    x.stroke();
  }

  x.strokeStyle='rgba(242,238,220,.80)';
  rodLeg(-27,18,k1,.1,22);
  rodLeg(-6,24,k2,1.2,24);
  rodLeg(22,22,k1,2.3,25);
  rodLeg(44,15,k2,3.0,23);

  // =========================================================
  // BODY WIREFRAME: starts coherent, breaks apart with entropy
  // =========================================================
  const bp=[
    [-45,-10],[-20,-28],[10,-31],[39,-18],[55,2],
    [38,28],[8,38],[-22,29],[-42,12],[-7,2],[25,4]
  ];

  x.strokeStyle='rgba(242,238,220,.19)';
  for(let a=0;a<bp.length;a++){
    for(let b=a+1;b<bp.length;b++){
      if(((a*7+b*11+seed)%10)<2 + Math.floor(ent*2)){
        x.beginPath();
        x.moveTo(
          bp[a][0]+j()*.42,
          bp[a][1]+j()*.42
        );
        x.lineTo(
          bp[b][0]+j()*.42,
          bp[b][1]+j()*.42
        );
        x.stroke();
      }
    }
  }

  // high entropy: duplicate ghost outlines, visibly losing coherence
  if(ent>.68){
    const ghosts=1+Math.floor((ent-.68)*7);
    x.strokeStyle='rgba(242,238,220,.08)';
    for(let g=0;g<ghosts;g++){
      const gx=(rng()-.5)*28*extreme;
      const gy=(rng()-.5)*28*extreme;
      x.beginPath();
      x.ellipse(
        gx,gy,
        58+(rng()-.5)*22*extreme,
        34+(rng()-.5)*18*extreme,
        (rng()-.5)*.6*extreme,
        0,Math.PI*2
      );
      x.stroke();
    }
  }

  x.restore(); // hamster transform

  // =========================================================
  // DEBRIS FIELD: sits around/behind hamster, density via entropy
  // =========================================================
  const particles=24+Math.floor(ent*105);
  x.strokeStyle='rgba(242,238,220,.30)';
  x.fillStyle='rgba(242,238,220,.44)';

  for(let i=0;i<particles;i++){
    const a=rng()*Math.PI*2;
    const rr=42+rng()*(92+high*78);
    const px=
      Math.cos(a+phase*.17)*rr +
      Math.sin(phase*1.8+i)*10*high;
    const py=
      Math.sin(a+phase*.14)*rr*.69 +
      Math.cos(phase*1.35+i*.3)*8*high;

    if(rng()<.58){
      x.fillRect(px,py,1.0,1.0);
    }else{
      const sz=2+rng()*(6+12*extreme);
      x.beginPath();
      x.moveTo(px-sz,py);
      x.lineTo(px,py-sz*.55);
      x.lineTo(px+sz,py);
      x.stroke();
    }
  }

  // entropy scratches
  if(ent>.32){
    const n=Math.floor((ent-.32)*80);
    x.strokeStyle='rgba(242,238,220,.20)';
    for(let i=0;i<n;i++){
      const px=(rng()-.5)*w*.86;
      const py=(rng()-.5)*h*.72;
      const len=10+rng()*(18+48*extreme);
      const ang=(rng()-.5)*(1.2+extreme*2.4);
      x.beginPath();
      x.moveTo(px,py);
      x.lineTo(
        px+Math.cos(ang)*len,
        py+Math.sin(ang)*len
      );
      x.stroke();
    }
  }

  x.restore();
}


function installWideRangeControl(el){
  if(!el)return;

  const setFromClientX=(clientX)=>{
    const rect=el.getBoundingClientRect();
    const min=parseFloat(el.min||0);
    const max=parseFloat(el.max||100);
    let p=(clientX-rect.left)/rect.width;
    p=Math.max(0,Math.min(1,p));
    const step=parseFloat(el.step||1);
    let value=min+p*(max-min);
    if(step>0)value=Math.round(value/step)*step;
    el.value=Math.max(min,Math.min(max,value));
    el.dispatchEvent(new Event('input',{bubbles:true}));
  };

  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    setFromClientX(e.clientX);
    try{el.setPointerCapture(e.pointerId)}catch(_){}
  });

  el.addEventListener('pointermove',e=>{
    if(e.buttons===1 || (e.pointerType==='touch' && el.hasPointerCapture?.(e.pointerId))){
      e.preventDefault();
      setFromClientX(e.clientX);
    }
  });

  // iOS fallback
  el.addEventListener('touchstart',e=>{
    if(e.touches&&e.touches[0]){
      e.preventDefault();
      setFromClientX(e.touches[0].clientX);
    }
  },{passive:false});

  el.addEventListener('touchmove',e=>{
    if(e.touches&&e.touches[0]){
      e.preventDefault();
      setFromClientX(e.touches[0].clientX);
    }
  },{passive:false});
}
document.querySelectorAll('input[type="range"]').forEach(installWideRangeControl);

$('start').addEventListener('click',async()=>{
  if(!started){
    if(!await ensureAudio())return;

    started=true;
    startTime=Date.now();
    $('start').textContent='■ STOP';

    if(ctx){
      const t=ctx.currentTime;
      [dryInput,echoInput,hallInput].forEach(g=>{
        if(!g)return;
        g.gain.cancelScheduledValues(t);
        g.gain.setTargetAtTime(1,t,.018);
      });
    }

    scheduleGhost();
    fireCrackle();
    scheduleHumDrop();

    clearInterval(timer);
    $('clock').textContent='00:00:00';
    timer=setInterval(()=>{
      const s=Math.floor((Date.now()-startTime)/1000);
      $('clock').textContent=[s/3600,s/60%60,s%60]
        .map(v=>String(Math.floor(v)).padStart(2,'0')).join(':');
    },1000);
  }else{
    started=false;

    clearInterval(timer);
    clearTimeout(ghostTimer);
    clearTimeout(crackleTimer);
    clearTimeout(humDropTimer);

    if(ctx&&ctx.state==='running'){
      const t=ctx.currentTime;
      [dryInput,echoInput,hallInput].forEach(g=>{
        if(!g)return;
        g.gain.cancelScheduledValues(t);
        g.gain.setTargetAtTime(0,t,.012);
      });
    }

    $('start').textContent='▶ PLAY';
    $('clock').textContent='00:00:00';
  }
});
